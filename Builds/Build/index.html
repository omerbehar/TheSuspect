  <body style="text-align: center; padding: 0; border: 0; margin: 0;">

<div id="loading-screen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 375px; height: 812px; background-color: black; display: flex; justify-content: center; align-items: center; margin: auto;  z-index: 1000;">
    <img src="loadingSceneBG.png" alt="Loading..." style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1001;">
        <img src="ICLlogo.png" alt="Logo" style="width: 175px; height: 73px; margin-bottom: 20px;"> <!-- Adjust width, height, and margin as needed -->
                <div style="color: white; font-size: 18px; margin-bottom: 20px;">Creating impact for a <br> sustainalbe future</div> <!-- Adjust color, font-size, and margin as needed -->

	<img id="loading-indicator" src="LoadingCircle.png" alt="Loading indicator" style="width: 50px; height: 50px;">
    </div>
</div>



    <canvas id="unity-canvas" width=375 height=812 tabindex="-1" style="width: 375px; height: 812px; background: #231F20"></canvas>
<style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-indicator {
            animation: spin 2s linear infinite;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.js"></script>
    <script src="Build/Builds.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }
	function hideLoadingScreen() {
    document.getElementById('loading-screen').style.display = 'none';
  }
  
  function startHideTimeout() {
    setTimeout(hideLoadingScreen, 2500);
  }
      var unityInstance = createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/Builds.data.unityweb",
        frameworkUrl: "Build/Builds.framework.js.unityweb",
        codeUrl: "Build/Builds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TheSuspect",
        productVersion: "1.0.2",
	onRuntimeInitialized: function () {
startHideTimeout();
      //document.getElementById('loading-screen').style.display = 'none';
    },
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      
	});

    </script>
<script>
// Create a div to hold log messages
window.onload = function() {

var logDiv = document.createElement('div');
logDiv.id = 'logDiv';
logDiv.style.position = 'fixed';
logDiv.style.bottom = '0';
logDiv.style.left = '0';
logDiv.style.width = '100%';
logDiv.style.height = '40px';
logDiv.style.backgroundColor = 'rgba(0,0,0,0)'; //change alpha to show
logDiv.style.color = 'white';
logDiv.style.overflowY = 'scroll';
logDiv.style.padding = '5px';
logDiv.style.boxSizing = 'border-box';
logDiv.style.zIndex = '1000'; // Ensure the log div appears above other elements
document.body.appendChild(logDiv);

// Create a function to log messages to the on-screen div
function logToScreen(message) {
    var messageDiv = document.createElement('div');
    messageDiv.textContent = message;
    //logDiv.appendChild(messageDiv); //remove comment to apply
}

// Redirect console.log to also log to the on-screen div
var originalConsoleLog = console.log;
console.log = function(message) {
    originalConsoleLog(message);
if (typeof message === 'string' && message.startsWith('LOG:')) {
            logToScreen(message);
        }
};

// Usage example
    console.log('LOG: This message will appear in both the browser console and on-screen');
    console.log('This message will only appear in the browser console');

};

    </script>
  </body>
</html>
